# ☢ REACTOR — full Hyprland config (classic .conf syntax)
# Optional: only linked when you run `install.sh --with-hyprland-conf`.
# If you use a Lua config (hyprland.lua, Hyprland 0.55+) the installer adds the
# reactor pieces to it instead and this file is not used.

$terminal = kitty
$launcher = rofi -show drun

monitor = , preferred, auto, 1

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(39FF14)
    col.inactive_border = rgb(123D0D)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 4
    active_opacity = 0.98
    inactive_opacity = 0.92
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(39, 255, 20, 0.18)
    }
}

animations {
    enabled = true
    bezier = nuclear, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, nuclear
    animation = windowsOut, 1, 4, nuclear, popin 80%
    animation = border, 1, 4, nuclear
    animation = fade, 1, 4, nuclear
    animation = workspaces, 1, 4, nuclear
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

exec-once = waybar

# Super+Z sidebar, Hyprland slide animation, eww daemon (generated by the installer)
source = ~/.config/hypr/reactor.conf

# Launcher / terminal / lock
bind = SUPER, R, exec, $launcher
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, L, exec, hyprlock

# Five fixed workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

# Window controls
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating
bind = SUPER, P, pseudo
bind = SUPER, J, togglesplit

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Applications
$browser = firefox
bind = SUPER, B, exec, $browser
