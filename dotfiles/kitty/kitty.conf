# ☢ REACTOR — kitty
# Only linked if you don't already have a kitty.conf. Otherwise the installer
# just adds `include reactor-kitty.conf` to yours.

include reactor-kitty.conf

bold_font auto
italic_font auto
bold_italic_font auto

cursor_shape beam
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0
hide_window_decorations yes

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
